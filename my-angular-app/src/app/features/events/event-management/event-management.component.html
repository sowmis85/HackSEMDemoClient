<div class="event-container">

  <div class="header">
    <div class="back-section">
    <a routerLink="/events" class="back-link">
      ← Back to Events Search
    </a>    
  </div>
    <button type="button"
      class="create-btn"
      (click)="createEventClick()">
      + Create Event
    </button>
  </div>

  <div class="filters">

    <input
      type="text"
      placeholder="Search Events"
      [(ngModel)]="searchText"
      (input)="filterEvents()">

    <select
      [(ngModel)]="selectedStatus"
      (change)="filterEvents()">

      <option value="">
        All Status
      </option>

      <option value="Draft">
        Draft
      </option>

      <option value="Published">
        Published
      </option>

      <option value="Cancelled">
        Cancelled
      </option>

    </select>

  </div>
<div class="card">
    <div class="card-header">
        Manage Events
        </div>
 <div class="card-body">
  <table class="table table-hover">

    <thead>
      <tr>
        <th>ID</th>
        <th>Event Name</th>
        <th>Category</th>
        <th>Date</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody>
    @for(event of filteredEvents; track event.eventId)
    {
      <tr>
        <td>{{event.eventId}}</td>
        <td>{{event.title}}</td>
        <td>{{event.category}}</td>
        <td>{{event.startDate| date}}</td>
        <td>
          <span
            [ngClass]="{
              'draft': event.status === 'Draft',
              'published': event.status === 'Published',
              'cancelled': event.status === 'Cancelled'
            }">
            {{event.status}}
          </span>
        </td>
        <td>

          <button
            class="edit-btn"
            (click)="editEvent(event)">

            ✏️

          </button>

          <button
            *ngIf="event.status === 'Draft'"
            class="publish-btn"
            (click)="publishEvent(event)">

            🚀

          </button>

          <button
            class="delete-btn"
            (click)="deleteEvent(event.eventId)">

            🗑️

          </button>

        </td>
      </tr>
    }
    </tbody>
  </table>
  </div>
</div>
</div>
